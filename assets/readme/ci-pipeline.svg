<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="172" viewBox="0 0 1200 172" role="img" aria-labelledby="title desc"><title id="title">Will Labs · fluxo de integração contínua</title><desc id="desc">Ilustração animada do pipeline: tokens, build, testes e auditoria. O status da execução é informado pelo badge do GitHub Actions no README.</desc><rect x="1" y="1" width="1198" height="170" rx="18" fill="#241C16" stroke="#65513D"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="32" fill="#DECFB7" font-size="11" letter-spacing="2">INTEGRAÇÃO CONTÍNUA · WILL LABS</text><path d="M50 145 H1150" fill="none" stroke="#65513D" stroke-width="2"/><path d="M50 145 H1150" fill="none" stroke="#F2CB82" stroke-width="2" stroke-dasharray="55 220"><animate attributeName="stroke-dashoffset" from="0" to="-550" dur="7s" repeatCount="indefinite"/></path><g><rect x="34" y="54" width="258" height="76" rx="12" fill="#32271E" stroke="#65513D"/><circle cx="57" cy="80" r="4" fill="#F2CB82"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="0s" repeatCount="indefinite"/></circle><text x="74" y="85" fill="#F2CB82" font-size="12" font-weight="700" letter-spacing="1.5">TOKENS</text><text x="53" y="111" fill="#DECFB7" font-size="14">Fonte semântica</text></g><g><rect x="322" y="54" width="258" height="76" rx="12" fill="#32271E" stroke="#65513D"/><circle cx="345" cy="80" r="4" fill="#F2CB82"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="1s" repeatCount="indefinite"/></circle><text x="362" y="85" fill="#F2CB82" font-size="12" font-weight="700" letter-spacing="1.5">BUILD</text><text x="341" y="111" fill="#DECFB7" font-size="14">React + TypeScript</text></g><g><rect x="610" y="54" width="258" height="76" rx="12" fill="#32271E" stroke="#65513D"/><circle cx="633" cy="80" r="4" fill="#F2CB82"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="2s" repeatCount="indefinite"/></circle><text x="650" y="85" fill="#F2CB82" font-size="12"