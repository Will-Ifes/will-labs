<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 196" width="1200" height="196" role="img" aria-labelledby="title desc">
<title id="title">Will Labs · etapas do CI</title>
<desc id="desc">Ilustração das etapas configuradas no workflow de CI. Job 1 · Qualidade: npm ci, Prettier, oxlint, Build, TypeScript, commitlint. Job 2 · Navegador e acessibilidade: Chromium, 8 temas, axe, Capturas. Job 3 · Outros motores: Firefox, WebKit. O resultado real de cada execução é o badge do GitHub Actions.</desc>
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif}
.kicker{font-size:11px;letter-spacing:2px;fill:#DECFB7}
.note{font-size:12px;fill:#DECFB7}
.job{font-size:11px;font-weight:700;letter-spacing:1px;fill:#F2CB82;text-transform:uppercase}
.step{font-size:13px;font-weight:700;fill:#FCF3E5;text-anchor:middle}
.detail{font-size:11px;fill:#DECFB7;text-anchor:middle}
.dot{fill:#443527}
.pulse{stroke:#F2CB82;stroke-width:2;stroke-linecap:round;stroke-dasharray:60 1200;animation:run 8s linear infinite}
@keyframes run{from{stroke-dashoffset:60}to{stroke-dashoffset:-1144}}
@media (prefers-reduced-motion:reduce){.pulse,[class*=" p"]{animation:none}}
</style>
<rect x="1" y="1" width="1198" height="194" rx="18" fill="#241C16" stroke="#65513D"/>
<text class="kicker" x="28" y="34">INTEGRAÇÃO CONTÍNUA · WILL LABS</text>
<text class="note" x="28" y="54">Etapas configuradas em .github/workflows/ci.yml. Ilustração, não status: o resultado real está no badge acima.</text>
<rect x="28" y="70" width="548" height="104" rx="12" fill="#32271E" stroke="#65513D"/><text class="job" x="44" y="90">Job 1 · Qualidade</text>
<rect x="600" y="70" width="365.3333333333333" height="104" rx="12" fill="#32271E" stroke="#65513D"/><text class="job" x="616" y="90">Job 2 · Navegador e acessibilidade</text>
<rect x="989.3333333333333" y="70" width="182.66666666666666" height="104" rx="12" fill="#32271E" stroke="#65513D"/><text class="job" x="1005.3333333333333" y="90">Job 3 · Outros motores</text>
<line x1="40" y1="112" x2="1160" y2="112" stroke="#65513D" stroke-width="2"/>
<line class="pulse" x1="40" y1="112" x2="1160" y2="112"/>
