<style>@keyframes p1{0%,8.33%{fill:#443527;r:6}14.33%{fill:#F2CB82;r:8}26.33%,100%{fill:#443527;r:6}}.p1{animation:p1 8s ease-in-out infinite}</style><circle class="dot p1" cx="165" cy="112" r="6"/><text class="step" x="165" y="140">Prettier</text><text class="detail" x="165" y="158">formato</text>
