<style>@keyframes p9{0%,75.00%{fill:#443527;r:6}81.00%{fill:#F2CB82;r:8}93.00%,100%{fill:#443527;r:6}}.p9{animation:p9 8s ease-in-out infinite}</style><circle class="dot p9" cx="919.6666666666666" cy="112" r="6"/><text class="step" x="919.6666666666666" y="140">Capturas</text><text class="detail" x="919.6666666666666" y="158">artefato</text>
<style>@keyframes p10{0%,83.33%{fill:#443527;r:6}89.33%{fill:#F2CB82;r:8}99.50%,100%{fill:#443527;r:6}}.p10{animation:p10 8s ease-in-out infinite}</style><circle class="dot p10" cx="1035" cy="112" r="6"/><text class="step" x="1035" y="140">Firefox</text><text class="detail" x="1035" y="158">smoke test</text>
<style>@keyframes p11{0%,91.67%{fill:#443527;r:6}97.67%{fill:#F2CB82;r:8}99.50%,100%{fill:#443527;r:6}}.p11{animation:p11 8s ease-in-out infinite}</style><circle class="dot p11" cx="1126.3333333333333" cy="112" r="6"/><text class="step" x="1126.3333333333333" y="140">WebKit</text><text class="detail" x="1126.3333333333333" y="158">smoke test</text>
