<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 196" width="1200" height="196" role="img" aria-labelledby="title desc">
<title id="title">Will Labs · etapas do CI</title>
<desc id="desc">Ilustração das etapas configuradas no workflow de CI. Job 1 · Qualidade: npm ci, Prettier, oxlint, Build, TypeScript, commitlint. Job 2 · Navegador e acessibilidade: Playwright, 8 temas, axe, Capturas. O resultado real de cada execução é o badge do GitHub Actions.</desc>
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif}
.kicker{font-size:11px;letter-spacing:2px;fill:#DECFB7}
.note{font-size:12px;fill:#DECFB7}
.job{font-size:11px;font-weight:700;letter-spacing:1px;fill:#F2CB82;text-transform:uppercase}
.step{font-size:13px;font-weight:700;fill:#FCF3E5;text-anchor:middle}
.detail{font-size:11px;fill:#DECFB7;text-anchor:middle}
.dot{fill:#443527}
.pulse{stroke:#F2CB82;stroke-width:2;stroke-linecap:round;stroke-dasharray:60 1200;animation:run 8s linear infinite}
@keyframes run{from{stroke-dashoffset:60}to{stroke-dashoffset:-1144}}
@media (prefers-reduced-motion:reduce){.pulse,[class*=" p"]{animation:none}}
</style>
<rect x="1" y="1" width="1198" height="194" rx="18" fill="#241C16" stroke="#65513D"/>
<text class="kicker" x="28" y="34">INTEGRAÇÃO CONTÍNUA · WILL LABS</text>
<text class="note" x="28" y="54">Etapas configuradas em .github/workflows/ci.yml. Ilustração, não status: o resultado real está no badge acima.</text>
<rect x="28" y="70" width="672" height="104" rx="12" fill="#32271E" stroke="#65513D"/><text class="job" x="44" y="90">Job 1 · Qualidade</text>
<rect x="724" y="70" width="448" height="104" rx="12" fill="#32271E" stroke="#65513D"/><text class="job" x="740" y="90">Job 2 · Navegador e acessibilidade</text>
<line x1="40" y1="112" x2="1160" y2="112" stroke="#65513D" stroke-width="2"/>
<line class="pulse" x1="40" y1="112" x2="1160" y2="112"/>
<style>@keyframes p0{0%,0.00%{fill:#443527;r:6}6.00%{fill:#F2CB82;r:8}18.00%,100%{fill:#443527;r:6}}.p0{animation:p0 8s ease-in-out infinite}</style><circle class="dot p0" cx="84" cy="112" r="6"/><text class="step" x="84" y="140">npm ci</text><text class="detail" x="84" y="158">lockfile</text>
<style>@keyframes p1{0%,10.00%{fill:#443527;r:6}16.00%{fill:#F2CB82;r:8}28.00%,100%{fill:#443527;r:6}}.p1{animation:p1 8s ease-in-out infinite}</style><circle class="dot p1" cx="196" cy="112" r="6"/><text class="step" x="196" y="140">Prettier</text><text class="detail" x="196" y="158">formato</text>
<style>@keyframes p2{0%,20.00%{fill:#443527;r:6}26.00%{fill:#F2CB82;r:8}38.00%,100%{fill:#443527;r:6}}.p2{animation:p2 8s ease-in-out infinite}</style><circle class="dot p2" cx="308" cy="112" r="6"/><text class="step" x="308" y="140">oxlint</text><text class="detail" x="308" y="158">0 erros</text>
<style>@keyframes p3{0%,30.00%{fill:#443527;r:6}36.00%{fill:#F2CB82;r:8}48.00%,100%{fill:#443527;r:6}}.p3{animation:p3 8s ease-in-out infinite}</style><circle class="dot p3" cx="420" cy="112" r="6"/><text class="step" x="420" y="140">Build</text><text class="detail" x="420" y="158">tokens + React</text>
<style>@keyframes p4{0%,40.00%{fill:#443527;r:6}46.00%{fill:#F2CB82;r:8}58.00%,100%{fill:#443527;r:6}}.p4{animation:p4 8s ease-in-out infinite}</style><circle class="dot p4" cx="532" cy="112" r="6"/><text class="step" x="532" y="140">TypeScript</text><text class="detail" x="532" y="158">tipos</text>
<style>@keyframes p5{0%,50.00%{fill:#443527;r:6}56.00%{fill:#F2CB82;r:8}68.00%,100%{fill:#443527;r:6}}.p5{animation:p5 8s ease-in-out infinite}</style><circle class="dot p5" cx="644" cy="112" r="6"/><text class="step" x="644" y="140">commitlint</text><text class="detail" x="644" y="158">mensagens</text>
<style>@keyframes p6{0%,60.00%{fill:#443527;r:6}66.00%{fill:#F2CB82;r:8}78.00%,100%{fill:#443527;r:6}}.p6{animation:p6 8s ease-in-out infinite}</style><circle class="dot p6" cx="780" cy="112" r="6"/><text class="step" x="780" y="140">Playwright</text><text class="detail" x="780" y="158">1440 e 390 px</text>
<style>@keyframes p7{0%,70.00%{fill:#443527;r:6}76.00%{fill:#F2CB82;r:8}88.00%,100%{fill:#443527;r:6}}.p7{animation:p7 8s ease-in-out infinite}</style><circle class="dot p7" cx="892" cy="112" r="6"/><text class="step" x="892" y="140">8 temas</text><text class="detail" x="892" y="158">interação</text>
<style>@keyframes p8{0%,80.00%{fill:#443527;r:6}86.00%{fill:#F2CB82;r:8}98.00%,100%{fill:#443527;r:6}}.p8{animation:p8 8s ease-in-out infinite}</style><circle class="dot p8" cx="1004" cy="112" r="6"/><text class="step" x="1004" y="140">axe</text><text class="detail" x="1004" y="158">WCAG 2.1 AA</text>
<style>@keyframes p9{0%,90.00%{fill:#443527;r:6}96.00%{fill:#F2CB82;r:8}99.50%,100%{fill:#443527;r:6}}.p9{animation:p9 8s ease-in-out infinite}</style><circle class="dot p9" cx="1116" cy="112" r="6"/><text class="step" x="1116" y="140">Capturas</text><text class="detail" x="1116" y="158">artefato</text>
