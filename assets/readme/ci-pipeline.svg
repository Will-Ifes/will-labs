<style>@keyframes p4{0%,33.33%{fill:#443527;r:6}39.33%{fill:#F2CB82;r:8}51.33%,100%{fill:#443527;r:6}}.p4{animation:p4 8s ease-in-out infinite}</style><circle class="dot p4" cx="439" cy="112" r="6"/><text class="step" x="439" y="140">TypeScript</text><text class="detail" x="439" y="158">tipos</text>
